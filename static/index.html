<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCIA AI Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
</head>
<body>
  <!-- Background subtle dynamic glow -->
  <div class="bg-glow" id="bgGlow"></div>

  <!-- Main Container -->
  <div class="dashboard-container">
    <!-- Top Header -->
    <header class="dashboard-header">
      <div class="brand">
        <div class="brand-logo">✦</div>
        <div class="brand-text">
          <h1>LUCIA</h1>
          <span class="subtext">Personal AI Voice Assistant</span>
        </div>
      </div>

      <div class="header-status">
        <div class="state-pill" id="statePill">
          <span class="state-dot" id="stateDot"></span>
          <span class="state-label" id="stateLabel">IDLE</span>
        </div>
        <div class="connection-badge" id="connBadge">
          <span class="conn-dot"></span>
          <span class="conn-label">ONLINE</span>
        </div>
      </div>
    </header>

    <!-- Main Content Grid -->
    <main class="main-content">
      <!-- 3D Orb Viewport -->
      <section class="orb-viewport">
        <canvas id="orbCanvas"></canvas>
        <div class="orb-overlay-hint" id="orbHint">
          <span>Say <strong>"Hey Jarvis"</strong> or press <strong>SPACE</strong></span>
        </div>
      </section>

      <!-- Live Chat Transcript Side Panel -->
      <aside class="chat-panel">
        <div class="chat-header">
          <h2>Live Transcript</h2>
          <span class="chat-model-tag">Qwen 2.5 7B</span>
        </div>
        
        <div class="chat-scroll" id="chatScroll">
          <div class="chat-empty-state" id="emptyState">
            <div class="empty-icon">🎙️</div>
            <p>Ready to converse. Ask a question or request an action.</p>
          </div>
        </div>

        <div class="chat-footer">
          <button class="manual-trigger-btn" id="manualBtn">
            <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <span id="btnLabel">Push to Talk / Interrupt [SPACE]</span>
          </button>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
